[package]
name = "agent-pty"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent terminal substrate with persistent PTYs, semantic screens, policy gates, and proof artifacts"
repository = "https://github.com/evalops/agent-pty"
homepage = "https://github.com/evalops/agent-pty"
readme = "README.md"
keywords = ["pty", "terminal", "agents", "evidence", "tmux"]
categories = ["command-line-utilities", "development-tools"]
publish = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "docs/**",
    "examples/**",
    "fixtures/**",
    "scripts/**",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
portable-pty = "0.9"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.8", features = ["serde", "v4"] }
vt100 = "0.16"

[dev-dependencies]
tempfile = "3.10"
