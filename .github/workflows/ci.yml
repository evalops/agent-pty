name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust and tmux smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate scripts and examples
        run: |
          bash -n scripts/e2e-tmux.sh
          bash -n examples/cli_repair_agent.sh
          python3 -m py_compile examples/http_agent.py examples/mcp_stdio_agent.py

      - name: Test
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Tmux end-to-end smoke
        run: cargo test --test e2e_tmux -- --ignored --nocapture
